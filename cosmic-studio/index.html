  <style>
    :root{--night:#10172f;--indigo:#17153f;--violet:#8656e8;--lav:#c7a9ff;--white:#f5f2ff;--coral:#ff9b91}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;}
    body{min-height:100vh;display:grid;place-items:center;padding:44px 5vw;background:radial-gradient(ellipse at 17% 12%,rgba(209,169,255,.44),transparent 30%),radial-gradient(ellipse at 84% 88%,rgba(103,76,164,.55),transparent 33%),linear-gradient(135deg,#8060a8 0%,#6e579b 48%,#514577 100%);font-family:'Manrope',sans-serif;color:var(--white);overflow-x:hidden}
    .stage{position:relative;width:min(1224px,100%);height:min(700px,calc(100vh - 88px));min-height:610px;border-radius:12px;overflow:hidden;background:linear-gradient(130deg,#191643 0%,#141a3c 48%,#10172f 100%);box-shadow:0 34px 90px rgba(24,13,50,.38),0 4px 18px rgba(19,12,44,.18);isolation:isolate}
    .stage:before,.stage:after{content:"";position:absolute;pointer-events:none;z-index:-1}
    .stage:before{inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(94,69,160,.23),transparent 43%),radial-gradient(ellipse at 5% 95%,rgba(103,50,150,.31),transparent 34%),radial-gradient(ellipse at 94% 13%,rgba(74,83,168,.19),transparent 33%)}
    .stage:after{inset:0;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.19'/%3E%3C/svg%3E")}
    .topbar{height:84px;padding:0 64px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:5}
    .brand{display:flex;align-items:center;gap:11px;font:700 11px 'DM Sans',sans-serif;letter-spacing:.19em;color:#f5f2ff;text-decoration:none}
    .brand-mark{width:24px;height:24px;border:1px solid rgba(199,169,255,.74);border-radius:50%;display:grid;place-items:center;position:relative}
    .brand-mark:before{content:"";width:7px;height:7px;background:var(--coral);border-radius:50%;box-shadow:0 0 12px #ff9b91}
    .brand-mark:after{content:"";position:absolute;width:30px;height:10px;border:1px solid rgba(199,169,255,.65);border-radius:50%;transform:rotate(-35deg)}
    nav{display:flex;align-items:center;gap:36px}
    nav a{font:500 11px 'Manrope',sans-serif;letter-spacing:.04em;color:rgba(245,242,255,.69);text-decoration:none;transition:color .2s}
    nav a:hover{color:white}
    nav .contact{color:#f5f2ff;border:1px solid rgba(199,169,255,.38);padding:10px 17px;border-radius:999px}
    .scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
    .content{position:absolute;z-index:3;left:50%;top:48%;width:min(470px,44%);transform:translate(-50%,-50%);text-align:center}
    .eyebrow{display:inline-flex;gap:9px;align-items:center;text-transform:uppercase;letter-spacing:.22em;font:600 9px 'DM Sans',sans-serif;color:#c7a9ff;margin-bottom:16px}
    .eyebrow:before,.eyebrow:after{content:"";height:1px;width:22px;background:linear-gradient(90deg,transparent,#a78ae8)}
    .eyebrow:after{transform:rotate(180deg)}
    h1{font:700 clamp(112px,13.4vw,184px)/.78 'Space Grotesk',sans-serif;letter-spacing:-.095em;margin:0 0 25px;padding-right:.095em;color:#fbf9ff;text-shadow:0 5px 34px rgba(150,123,238,.22)}
    h1 span{display:inline-block;background:linear-gradient(180deg,#fff 12%,#d5c2ff 76%,#ad8ff3 100%);background-clip:text;-webkit-background-clip:text;color:transparent}
    h2{font:700 25px/1.25 'Manrope',sans-serif;letter-spacing:-.045em;margin:0 0 11px;color:#fff}
    .description{max-width:355px;margin:0 auto;color:rgba(230,224,250,.73);font:400 12px/1.8 'Manrope',sans-serif}
    .actions{display:flex;align-items:center;justify-content:center;gap:22px;margin-top:25px}
    .primary{height:43px;padding:0 20px;display:inline-flex;align-items:center;gap:11px;border-radius:6px;background:linear-gradient(110deg,#9a69ed,#8050db);box-shadow:0 8px 22px rgba(113,71,205,.3),inset 0 1px rgba(255,255,255,.3);color:#fff;text-decoration:none;font:700 11px 'Manrope',sans-serif;transition:transform .2s,box-shadow .2s}
    .primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(113,71,205,.42)}
    .primary svg{width:14px;height:14px}
    .secondary{color:#d5c5fa;text-decoration:none;font:500 10px 'DM Sans',sans-serif;letter-spacing:.03em;border-bottom:1px solid rgba(199,169,255,.35);padding:5px 0}
    .secondary:hover{color:#fff;border-color:#fff}
    .bottom{position:absolute;z-index:5;bottom:0;left:0;right:0;height:69px;padding:0 64px;display:flex;align-items:center;justify-content:space-between}
    .socials{display:flex;align-items:center;gap:17px}
    .socials a{width:16px;height:16px;color:rgba(224,217,245,.64);display:grid;place-items:center;transition:color .2s,transform .2s}
    .socials a:hover{color:white;transform:translateY(-2px)}.socials svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
    .footnote{display:flex;align-items:center;gap:13px;color:rgba(213,197,250,.57);font:500 9px 'DM Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .footnote i{display:block;width:31px;height:1px;background:linear-gradient(90deg,transparent,#c7a9ff)}
    .scrollhint{position:absolute;right:25px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;display:flex;align-items:center;gap:10px;color:rgba(218,205,251,.39);font:500 8px 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;z-index:3}
    .scrollhint:after{content:"";height:37px;width:1px;background:linear-gradient(#9b83d5,transparent)}
    @media(max-width:760px){body{padding:16px}.stage{height:calc(100svh - 32px);min-height:650px}.topbar{height:72px;padding:0 24px}nav{gap:15px}nav a{font-size:10px}nav a:nth-child(1),nav a:nth-child(2){display:none}nav .contact{padding:8px 12px}.content{top:47%;width:82%}h1{font-size:clamp(112px,29vw,160px)}h2{font-size:22px}.description{font-size:11px}.bottom{padding:0 25px}.scrollhint{right:10px}.scene .planet-wrap{transform:translate(-40px,18px) scale(.82);transform-origin:150px 300px}.scene .astronaut-wrap{transform:translate(38px,70px) scale(.78);transform-origin:980px 390px}.scene .rocket-wrap{transform:translate(15px,25px) scale(.82);transform-origin:300px 170px}}
    @media(max-width:420px){nav{gap:11px}nav a{font-size:9px}.brand{font-size:9px;letter-spacing:.14em}.content{top:49%}.actions{gap:15px}.bottom{height:57px}.footnote{font-size:7px}.scrollhint{display:none}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
